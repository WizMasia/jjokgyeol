name: Native Windows proof
on:
  push:
    branches: [feature/native-desktop]
    paths:
      - .github/workflows/native-proof.yml
      - .dockerignore
      - Dockerfile
      - app/**
      - '!app/**/*.md'
      - desktop/**
      - '!desktop/**/*.md'
      - proofs/numbering/**
      - proofs/engine-comparison/manuscript.md
      - tests/pdf_metrics.py
      - runtime.lock
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Export Debian TeX resources
        run: desktop/qa/runtime/export-resources.sh "$RUNNER_TEMP/resources.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tex-resources
          path: ${{ runner.temp }}/resources.tar
          retention-days: 1
  windows-proof:
    needs: resources
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tex-resources
          path: ${{ runner.temp }}/resources
      - name: Build and verify native proof
        run: desktop/qa/runtime/verify.ps1 "${{ runner.temp }}/resources/resources.tar" "${{ runner.temp }}/native-proof"
      - name: Save proof and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-proof
          path: ${{ runner.temp }}/native-proof/results/
          if-no-files-found: warn
          retention-days: 7
