# 쪽결 웹 편집기 로컬 실행용 Docker Compose 설정 (보안 강화 플래그 포함)
# Docker Compose configuration for running the JJokgyeol web editor locally with security hardening.
services:
  jjokgyeol:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    image: jjokgyeol:local-editor
    platform: ${JJOKGYEOL_PLATFORM:-linux/arm64}
    container_name: jjokgyeol-local
    ports:
      - "${JJOKGYEOL_BIND_ADDR:-127.0.0.1}:${JJOKGYEOL_PORT:-8780}:8000"
    # 읽기 전용 루트 파일시스템, 권한 제거, 프로세스·메모리 상한 적용
    # Enforce read-only rootfs, dropped capabilities, and PID/memory limits.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    # Linux 호스트에서도 로컬 AI 서버(LM Studio·Ollama)에 선택적으로 연결할 수 있도록 매핑
    # Allow optional host.docker.internal access on Linux hosts when explicitly allowlisted.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 기본 허용 루프백 외 접속 호스트가 필요하면 쉼표로 지정 / Additional allowed Host headers (comma-separated).
      JJOKGYEOL_ALLOWED_HOSTS: "${JJOKGYEOL_ALLOWED_HOSTS:-}"
      # 사용자 지정 AI 서버 기본 주소 허용 목록 / Allowlisted custom AI base URLs (comma-separated).
      JJOKGYEOL_DECISION_BASE_URLS: "${JJOKGYEOL_DECISION_BASE_URLS:-}"
      # 선택적 스캔 서식 판독 비전 모델 설정 / Optional vision model settings for scanned reference pages.
      JJOKGYEOL_VISION_URL: "${JJOKGYEOL_VISION_URL:-}"
      JJOKGYEOL_VISION_MODEL: "${JJOKGYEOL_VISION_MODEL:-}"
      JJOKGYEOL_VISION_TOKEN: "${JJOKGYEOL_VISION_TOKEN:-}"
    restart: unless-stopped
